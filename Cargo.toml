[package]
name = "codeguesser"
version = "1.0.0"
edition = "2021"
description = "A terminal game: guess which repo in your GitHub org a random code snippet came from."
readme = "README.md"
publish = false

[dependencies]
ratatui = "0.29"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dirs = "5"
rpassword = "7"
time = "0.3"
percent-encoding = "2"
regex = "1"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[profile.release]
lto = true
strip = true
